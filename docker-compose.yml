services:
  cloudsaver:                  # 从 Telegram 等频道搜 115 分享链接（首次打开需注册账号，注册码请查它的文档并尽快修改默认值）
    image: jiangrui1994/cloudsaver:latest
    container_name: cloud-saver
    ports: ["8008:8008"]
    volumes: ["./data/cloudsaver/data:/app/data", "./data/cloudsaver/config:/app/config"]
    restart: unless-stopped

  pansou:                      # 网盘分享链接搜索（115 + 磁力）
    image: ghcr.io/fish2018/pansou:latest   # 镜像名/端口请以 PanSou 官方 README 为准
    container_name: pansou
    ports: ["8888:8888"]
    restart: unless-stopped

  bridge:
    image: ghcr.io/guanlu21/emby-request-bridge:latest   # 由 GitHub Actions 构建；想本地构建就改成 build: .
    container_name: request-bridge
    ports: ["8686:8686"]
    volumes: ["./data/bridge:/data"]
    depends_on: [cloudsaver, pansou]
    restart: unless-stopped
