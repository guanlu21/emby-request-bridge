<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>求片</title>
<style>
:root{--bg:#f3f5f9;--sf:#fff;--line:#dde2ec;--fg:#151a26;--mut:#6b7590;--ac:#2f5fd0;--acfg:#fff;--ok:#1a7f37;--bad:#c62828;--run:#2f5fd0;--warn:#a25f00}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--sf:#182030;--line:#27314a;--fg:#e6eaf2;--mut:#8a94aa;--ac:#6f9bff;--acfg:#0b1020;--ok:#4cc26b;--bad:#ef6a6a;--run:#6f9bff;--warn:#e0a13a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:17px}nav{display:flex;gap:4px;flex:1}
nav button{border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--bg);color:var(--fg);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:6px;padding:6px 14px;cursor:pointer}
.btn.pri{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.btn:disabled{opacity:.55;cursor:default}
input[type=text],input[type=password],select{border:1px solid var(--line);background:var(--sf);border-radius:6px;padding:8px 10px;width:100%}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hide{display:none!important}
.login{max-width:340px;margin:12vh auto;display:grid;gap:12px}
.login h2{margin:0 0 4px}
.err{color:var(--bad);min-height:1.4em;font-size:14px}
.sbar{display:flex;gap:8px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:6px}
.poster{aspect-ratio:2/3;background:var(--line);border-radius:6px;overflow:hidden;position:relative}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:1px 7px;border-radius:4px}
.card h4{margin:0;font-size:14px;line-height:1.3}.card small{color:var(--mut)}
.card .btn{width:100%;padding:5px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500}
.s-done{color:var(--ok)}.s-failed,.s-rejected{color:var(--bad)}.s-searching,.s-downloading,.s-queued{color:var(--run)}.s-pending{color:var(--warn)}
small{color:var(--mut)}details pre{white-space:pre-wrap;margin:4px 0;color:var(--mut);font:12px/1.5 inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.bar select{width:auto}
.form{display:grid;gap:14px;max-width:640px}
.form h3{margin:10px 0 0;font-size:15px}
.row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--sf);padding:6px 18px;cursor:pointer}.seg button.on{background:var(--ac);color:var(--acfg)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--fg);padding:20px;max-width:380px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:flex;gap:8px;padding:5px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:.95}
@media(max-width:560px){.row{grid-template-columns:1fr}main{padding:14px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head><body>
<header id="hd" class="hide"><b>求片</b>
  <nav id="nav"></nav><small id="who"></small><button class="btn" onclick="logout()">退出</button></header>
<main>
<section id="v-login" class="login hide">
  <h2>登录求片</h2><small>使用你的 Emby 用户名和密码</small>
  <input id="u" type="text" placeholder="用户名" autocomplete="username">
  <input id="p" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">
  <div class="err" id="lerr"></div>
  <button class="btn pri" onclick="login()">登录</button>
</section>

<section id="v-search" class="hide">
  <div class="sbar"><input id="q" type="text" placeholder="输入影片或剧集名称" onkeydown="if(event.key=='Enter')search()">
    <button class="btn pri" onclick="search()" style="white-space:nowrap">搜索</button></div>
  <div id="grid" class="grid"></div><div id="sempty" class="empty">搜索后选择一部影片，点「求片」即可。</div>
</section>

<section id="v-mine" class="hide"><div class="wrap"><table><thead><tr><th>片名</th><th>状态</th><th>已选资源</th></tr></thead><tbody id="mine"></tbody></table></div>
  <div id="mempty" class="empty hide">还没有求过片。</div></section>

<section id="v-admin" class="hide">
  <div class="bar">
    <select id="flt" onchange="renderAdmin()"><option value="">全部状态</option><option value="pending">待审批</option><option value="active">进行中</option><option value="failed">失败</option><option value="done">已完成</option><option value="rejected">已拒绝</option></select>
    <select id="usr" onchange="renderAdmin()"><option value="">所有用户</option></select>
    <button class="btn" onclick="batch('approve')">批量通过</button><button class="btn" onclick="batch('reject')">批量拒绝</button>
    <button class="btn" onclick="batch('retry')">批量重试</button><button class="btn" onclick="batch('delete')">批量删除</button>
    <small id="cnt"></small></div>
  <div class="wrap"><table><thead><tr><th><input type="checkbox" id="all" onchange="toggleAll(this.checked)" aria-label="全选"></th><th>片名</th><th>求片人</th><th>状态</th><th>已选资源</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>

<section id="v-set" class="hide"><div class="form">
  <h3>代理</h3>
  <div class="row"><span>启用代理</span><div class="seg" id="s-proxy"><button data-v="1">开启</button><button data-v="0">关闭</button></div></div>
  <div class="row"><span>代理地址</span><input id="s-purl" type="text" placeholder="http://192.168.1.10:7891"></div>
  <div class="row"><span>代理用户名</span><input id="s-puser" type="text" placeholder="可选"></div>
  <div class="row"><span>代理密码</span><input id="s-ppass" type="password" placeholder="可选；留空不修改"></div>
  <small>代理地址不要写 127.0.0.1：容器里的 127.0.0.1 指向容器自己，请写 NAS 的局域网 IP。</small>
  <h3>TMDB</h3>
  <div class="row"><span>API Key</span><input id="s-key" type="password"></div>
  <div class="row"><span>语言（影响搜索和命名）</span><select id="s-lang"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en-US">English</option><option value="ja-JP">日本語</option></select></div>
  <div class="row"><span>API 主机名</span><input id="s-api" type="text"></div>
  <div class="row"><span>图片主机名</span><input id="s-img" type="text"></div>
  <div style="display:flex;gap:8px;align-items:center"><button class="btn pri" onclick="saveSet()">保存设置</button>
    <button class="btn" onclick="testSet()">测试连通性</button><small id="tres"></small></div>
</div></section>
</main>

<dialog id="dlg"><h3 id="dt" style="margin-top:0"></h3><div id="dseasons"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" onclick="dlg.close()">取消</button><button class="btn pri" id="dok">确认求片</button></div></dialog>
<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAME={pending:'待审批',queued:'排队中',searching:'搜索中',downloading:'下载中',done:'已完成',failed:'失败',rejected:'已拒绝'};
const BUSY=['queued','searching','downloading'];
let me=null,items=[],data=[],sel=new Set(),proxyOn=false,timer=null;

async function api(path,opt={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt,body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status==401&&path!='/api/login'&&path!='/api/me'){showLogin();throw new Error('请先登录')}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||('请求失败 '+r.status));
  return d;
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}
function view(v){
  ['login','search','mine','admin','set'].forEach(x=>$('v-'+x).classList.toggle('hide',x!=v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
  clearInterval(timer);
  if(v=='mine'){loadMine();timer=setInterval(loadMine,6000)}
  if(v=='admin'){loadAdmin();timer=setInterval(loadAdmin,6000)}
  if(v=='set')loadSet();
  if(v=='search')$('q').focus();
}
function showLogin(){me=null;$('hd').classList.add('hide');view('login')}
async function start(){
  try{me=await api('/api/me')}catch(e){return showLogin()}
  $('hd').classList.remove('hide');$('who').textContent=me.name+(me.admin?'（管理员）':'');
  const tabs=[['search','搜索求片'],['mine','我的请求']].concat(me.admin?[['admin','管理'],['set','设置']]:[]);
  $('nav').innerHTML=tabs.map(([v,n])=>`<button data-v="${v}" onclick="view('${v}')">${n}</button>`).join('');
  view('search');
}
async function login(){
  $('lerr').textContent='';
  try{await api('/api/login',{method:'POST',body:{username:$('u').value,password:$('p').value}});$('p').value='';start()}
  catch(e){$('lerr').textContent=e.message}
}
async function logout(){await api('/api/logout',{method:'POST'});showLogin()}

/* ---- 搜索与求片 ---- */
function renderGrid(){
  $('grid').innerHTML=items.map((x,i)=>{
    const st=x.requested;let label='求片',dis=false;
    if(x.type=='movie'&&x.in_library){label='已入库';dis=true}
    else if(st=='pending'){label='待审批';dis=true}
    else if(BUSY.includes(st)){label='处理中';dis=true}
    else if(st=='done'&&x.type=='movie'){label='已完成';dis=true}
    else if(x.type=='tv'&&x.in_library)label='补季求片';
    return `<div class="card"><div class="poster">${x.poster?`<img loading="lazy" src="/img/w342/${esc(x.poster.slice(1))}" alt="">`:''}<span class="tag">${x.type=='movie'?'电影':'剧集'}</span></div>
    <h4>${esc(x.title)}</h4><small>${esc(x.year)}${x.rating?' · 评分 '+x.rating:''}</small>
    <button class="btn ${dis?'':'pri'}" ${dis?'disabled':''} onclick="ask(${i})">${label}</button></div>`}).join('');
}
async function search(){
  const q=$('q').value.trim();if(!q)return;
  $('sempty').textContent='搜索中…';$('sempty').classList.remove('hide');$('grid').innerHTML='';
  try{items=await api('/api/search?q='+encodeURIComponent(q))}catch(e){$('sempty').textContent=e.message;return}
  $('sempty').textContent='没有找到，换个关键词试试。';$('sempty').classList.toggle('hide',items.length>0);
  renderGrid();
}
async function ask(i){
  const x=items[i];
  if(x.type=='movie')return send(x,[]);
  let t;try{t=await api('/api/tv/'+x.id)}catch(e){return toast(e.message)}
  $('dt').textContent=x.title+'：选择要求的季';
  $('dseasons').innerHTML=t.seasons.map(s=>`<label><input type="checkbox" value="${s.season}" checked>${esc(s.name||('第'+s.season+'季'))} <small>${s.episodes} 集</small></label>`).join('');
  $('dok').onclick=()=>{const ss=[...document.querySelectorAll('#dseasons input:checked')].map(c=>+c.value);
    if(!ss.length)return toast('至少选一季');dlg.close();send(x,ss)};
  dlg.showModal();
}
async function send(x,seasons){
  try{
    const r=await api('/api/request',{method:'POST',body:{media_type:x.type,tmdb_id:x.id,title:x.title,year:x.year,seasons}});
    if(!r.created.length)return toast('这部片已经有人求过了');
    toast(r.status=='pending'?'已提交，等待管理员审批':'已提交，正在自动寻找资源');
    x.requested=r.status=='pending'?'pending':'queued';renderGrid();
  }catch(e){toast(e.message)}
}

/* ---- 我的请求 ---- */
async function loadMine(){
  const d=await api('/api/requests');
  $('mempty').classList.toggle('hide',d.length>0);
  $('mine').innerHTML=d.map(x=>`<tr><td>${esc(x.title)}${x.season?` <small>第${x.season}季</small>`:''}</td>
    <td class="s-${x.status}">${NAME[x.status]||x.status}<br><small>${esc(x.error)}</small></td><td><small>${esc(x.picked)}</small></td></tr>`).join('');
}

/* ---- 管理 ---- */
async function loadAdmin(){
  data=await api('/api/requests');
  const u=$('usr'),cur=u.value,names=[...new Set(data.map(x=>x.requester).filter(Boolean))].sort();
  u.innerHTML='<option value="">所有用户</option>'+names.map(n=>`<option ${n==cur?'selected':''}>${esc(n)}</option>`).join('');
  renderAdmin();
}
function shown(){
  const f=$('flt').value,u=$('usr').value;
  return data.filter(x=>(!u||x.requester==u)&&(!f||(f=='active'?BUSY.includes(x.status):x.status==f)));
}
function renderAdmin(){
  const d=shown();$('cnt').textContent=`共 ${d.length} 条，已选 ${sel.size} 条`;
  $('rows').innerHTML=d.map(x=>`<tr><td><input type="checkbox" ${sel.has(x.id)?'checked':''} onchange="pick(${x.id},this.checked)" aria-label="选择"></td>
  <td>${esc(x.title)}${x.season?` <small>第${x.season}季</small>`:''}<details><summary><small>日志</small></summary><pre>${esc(JSON.parse(x.log).join('\n'))}</pre></details></td>
  <td>${esc(x.requester)||'<small>-</small>'}</td><td class="s-${x.status}">${NAME[x.status]||x.status}<br><small>${esc(x.error)}</small></td><td><small>${esc(x.picked)}</small></td></tr>`).join('');
}
function pick(id,on){on?sel.add(id):sel.delete(id);$('cnt').textContent=`共 ${shown().length} 条，已选 ${sel.size} 条`}
function toggleAll(on){shown().forEach(x=>on?sel.add(x.id):sel.delete(x.id));renderAdmin()}
async function batch(action){
  if(!sel.size)return toast('先勾选要处理的请求');
  if(action=='delete'&&!confirm('确定删除选中的记录？'))return;
  const r=await api('/api/requests/batch',{method:'POST',body:{action,ids:[...sel]}});
  toast(`已处理 ${r.done.length} 条`);sel.clear();$('all').checked=false;loadAdmin();
}

/* ---- 设置 ---- */
function setProxy(on){proxyOn=on;document.querySelectorAll('#s-proxy button').forEach(b=>b.classList.toggle('on',(b.dataset.v=='1')==on))}
document.querySelectorAll('#s-proxy button').forEach(b=>b.onclick=()=>setProxy(b.dataset.v=='1'));
async function loadSet(){
  const s=await api('/api/settings');setProxy(s.proxy_enabled);
  $('s-purl').value=s.proxy_url;$('s-puser').value=s.proxy_user;$('s-lang').value=s.language;$('s-api').value=s.api_host;$('s-img').value=s.image_host;
  $('s-ppass').value='';$('s-key').value='';$('s-key').placeholder=s.has_tmdb_key?'已配置；留空不修改':'粘贴 TMDB API Key';$('tres').textContent='';
}
async function saveSet(){
  try{await api('/api/settings',{method:'PUT',body:{proxy_enabled:proxyOn,proxy_url:$('s-purl').value,proxy_user:$('s-puser').value,
    proxy_pass:$('s-ppass').value,tmdb_key:$('s-key').value,language:$('s-lang').value,api_host:$('s-api').value,image_host:$('s-img').value}});
    toast('设置已保存');loadSet()}catch(e){toast(e.message)}
}
async function testSet(){
  $('tres').textContent='测试中…';const r=await api('/api/settings/test',{method:'POST'});
  $('tres').textContent=r.ok?`连接正常（${r.ms} ms）`:'失败：'+r.error;
}
start();
</script></body></html>
