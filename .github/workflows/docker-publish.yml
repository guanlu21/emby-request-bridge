name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # 推送到 GHCR 必须有这一项

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false      # 不附带 attestation 清单，很多 NAS 面板/代理处理不了
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 备用：导出 arm64 镜像包，可在 Actions 运行页下载后，在 NAS「镜像管理」里本地导入
      - name: Export image tar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          provenance: false
          tags: emby-request-bridge:latest
          outputs: type=docker,dest=/tmp/emby-request-bridge.tar
          cache-from: type=gha

      - uses: actions/upload-artifact@v4
        with:
          name: emby-request-bridge-image-arm64
          path: /tmp/emby-request-bridge.tar
          retention-days: 7
